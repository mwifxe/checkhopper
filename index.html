<style>
/* Layout: single mobile column; sticky progress bar with day chips; collapsible day cards, each with its own editable date */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a63; --line:#d6ddd8;
  --accent:#2f7d4f; --accent-soft:#e1efe6; --warn:#a4631a; --warn-soft:#f6ead9; --band:#d9a521;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --surface:#1c231f; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2f3934;
  --accent:#6cc28e; --accent-soft:#1f3529; --warn:#e0a35a; --warn-soft:#3a2c1b; --band:#e8b93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --surface:#1c231f; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2f3934;
  --accent:#6cc28e; --accent-soft:#1f3529; --warn:#e0a35a; --warn-soft:#3a2c1b; --band:#e8b93a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}

header{display:flex;align-items:center;gap:14px;padding-block:28px 18px}
.logo{flex:none;width:68px;height:68px;color:var(--fg);background:none;border:0;padding:0;cursor:pointer}
.logo svg{width:100%;height:100%;overflow:visible;display:block}
.logo:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.lead{color:var(--muted);font-size:15px;margin:0 0 16px}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.overall-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.today{border-color:var(--accent)}

.days{display:grid;gap:12px;margin-top:16px}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:120px}
summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:16px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.dname{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dname .moved{color:var(--warn);text-transform:none;letter-spacing:0;margin-left:6px}
.dtitle{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;grid-column:1}
.count{grid-row:1 / span 2;grid-column:2;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.count::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details[open] .count::after{transform:rotate(-135deg) translateY(-2px)}
.day.done .count{color:var(--accent)}
.body{padding:0 16px 6px}
.when{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-size:14px;color:var(--muted)}
.when input[type=date]{font:inherit;font-family:var(--mono);font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px}
.when input[type=date]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.goal{color:var(--muted);font-size:15px;margin:0 0 10px}
.alert{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:15px;margin:0 0 10px}
.alert strong{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
label.task{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 0;cursor:pointer;min-height:48px}
input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0}
.txt b{font-weight:700}
.sec{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.note{display:block;color:var(--muted);font-size:15px;margin-top:3px}
li.checked .txt{color:var(--muted)}
li.checked .txt b{text-decoration:line-through}
footer{margin-top:24px;color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:start}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.reset{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar>i,.count::after{transition:none}}
</style>

<div class="wrap">
<header>
  <button class="logo" id="logo" type="button" aria-label="Hopper (tap to make it jump)">
    <svg viewBox="0 0 72 72" aria-hidden="true"><ellipse id="shadow" cx="36" cy="68.5" rx="30" ry="2.2" fill="currentColor" opacity=".22"/><g id="hopper"></g></svg>
  </button>
  <div>
    <div class="eyebrow">Hopper Project · Deliverable 2</div>
    <h1>7-day plan</h1>
  </div>
</header>
<p class="lead" id="lead"></p>

<div class="sticky">
  <div class="overall-row"><span>Overall progress</span><span id="totalTxt">0 / 0</span></div>
  <div class="bar"><i id="totalBar"></i></div>
  <nav class="chips" id="chips" aria-label="Jump to a day"></nav>
</div>

<div class="days" id="days"></div>

<footer>
  <span>Your progress and dates are saved in this browser.</span>
  <div class="btns">
    <button type="button" class="reset" id="resetDates">Reset dates</button>
    <button type="button" class="reset" id="reset">Uncheck everything</button>
  </div>
</footer>
</div>

<script>
const DUE="2026-10-28";
const plan=[
 {iso:"2026-10-13",t:"Document what you already have",goal:"Make the most of the fact that iteration 1 and the improved prototype are already built.",items:[
  ["Photograph iteration 1 and the improved prototype","Sharp, well lit, clean background: one overall view and one close-up of the energy mechanism.","6"],
  ["Write down what failed in v1 and what you changed in v2","Use real numbers if you have them (for example, approximate jump height).","6"],
  ["List every material and what each one was used for","","6"],
  ["Choose the type of release","Trigger, latch, magnets... and where it goes on the hopper. Sketch 2 options and pick one.","5"]]},
 {iso:"2026-10-14",t:"Release in CAD",goal:"Design it and build it into the assembly, not as a loose part.",items:[
  ["Model the release parts in SolidWorks","","5"],
  ["Add it to the assembly with mates","","4"],
  ["Set up the locked and released positions","You will need both for the side-by-side screenshots.","5"],
  ["Write the release parts list and the job of each part","","5"]]},
 {iso:"2026-10-15",t:"Physical release",goal:"Build it and make it lock and release cleanly.",items:[
  ["Build the release into the prototype","","6"],
  ["Test load, lock and trigger several times, and adjust","Write down what you adjusted: it also counts as an iteration.","9"],
  ["Take a sharp close-up photo of the release","This is the third required photo.","6"]]},
 {iso:"2026-10-16",t:"Tests and video",goal:"At least 3 measured tests, and the video in the order the guide asks for.",alert:"The video has to show the release being triggered, so these tests must come after the physical release is done.",items:[
  ["Set up for filming","Phone fixed at table height, side view, good light, ruler or tape measure in frame.","7"],
  ["Film in order: rest, loading, close-up of the release, then the jump with no cuts","","Video"],
  ["Do at least 2 jump attempts in a row on camera","","Video"],
  ["Run 3 tests, changing one thing each time, and fill in the table","What changed, height in cm, direction, observations and a frame from the video. If it doesn't jump, record 0 cm and explain why.","7"],
  ["Upload the video to Drive with access set to \"Anyone with the link\"","","Video"]]},
 {iso:"2026-10-17",t:"CAD images and first sections",goal:"Take every screenshot and write the design part.",items:[
  ["Loaded / rest table: front and isometric views (4 images)","Add 2 to 4 lines under each column explaining what stretches or compresses.","4"],
  ["Full SolidWorks screenshot with the FeatureManager visible","Do not crop it.","4"],
  ["Screenshots of the release locked and released, side by side","","5"],
  ["Hopper image with labels and arrows","Body, legs, rubber band or spring, and the release.","5"],
  ["Write the problem definition and objectives","","3"],
  ["Write the assembly by parts, where energy is stored, and changes since Deliverable 1","For each part: what it represents in the flea and what it does.","4"],
  ["Write the release description and how it works step by step","What triggers it and which direction the force acts in.","5"]]},
 {iso:"2026-10-18",t:"Analysis",goal:"This weighs the most: a well-analyzed prototype is worth more than one that only works.",items:[
  ["Prototype photo section with figure captions","","6"],
  ["Move the test table into the report","","7"],
  ["Results: height vs. target, stability, direction and materials","2 to 4 lines each.","7"],
  ["CAD vs. prototype comparison","What stayed the same, what was simplified, and why.","8"],
  ["Iteration and next steps","Every change comes from a test: \"In test 2... so I will change... and I will check it by...\".","9"]]},
 {iso:"2026-10-19",t:"Wrap-up and review",goal:"Get it ready to submit.",items:[
  ["Conclusions, cover page, table of contents and appendices","","1, 2, 10, 11"],
  ["Number every image and table and refer to them in the text","","Format"],
  ["Check the writing: first person and technical language","\"Release of elastic energy\", not \"the rubber band pushes it\".","Format"],
  ["Spell-check, including release (not realese)","","Format"],
  ["Paste the video link into section 5 and open it in an incognito window","","Video"],
  ["Export the Word file to PDF, named LastName_FirstName","","Submit"]]}
];

const KEY="hopper-e2-en-checks", DKEY="hopper-e2-en-dates";
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let state=load(KEY), dates=load(DKEY);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const secLabel=s=>/^\d/.test(s)?"Sec. "+s:s;
const dateOf=i=>dates[i]||plan[i].iso;
const parse=iso=>{const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(iso,o)=>parse(iso).toLocaleDateString("en-US",o);
const short=iso=>fmt(iso,{weekday:"short",month:"short",day:"numeric"});
const now=new Date();
const todayIso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

const root=document.getElementById("days"), chips=document.getElementById("chips");
plan.forEach((day,di)=>{
  const el=document.createElement("details");el.className="day";el.id="d"+di;
  el.innerHTML=`<summary><span class="dname"></span><span class="count"></span><span class="dtitle">${esc(day.t)}</span></summary>
  <div class="body">
  <label class="when" for="date${di}">Planned for <input type="date" id="date${di}" data-d="${di}"></label>
  <p class="goal">${esc(day.goal)}</p>${day.alert?`<div class="alert"><strong>Heads up:</strong> ${esc(day.alert)}</div>`:""}
  <ul>${day.items.map((it,ii)=>{const id=`c${di}-${ii}`;return `<li><label class="task" for="${id}"><input type="checkbox" id="${id}" data-k="${id}">
  <span class="txt"><b>${esc(it[0])}</b><span class="sec">${esc(secLabel(it[2]))}</span>${it[1]?`<span class="note">${esc(it[1])}</span>`:""}</span></label></li>`}).join("")}</ul></div>`;
  root.appendChild(el);
});

function order(){return plan.map((_,i)=>i).sort((a,b)=>dateOf(a)<dateOf(b)?-1:dateOf(a)>dateOf(b)?1:a-b)}

function openToday(){
  const o=order();
  let idx=o.find(i=>dateOf(i)===todayIso);
  if(idx===undefined) idx=o.find(i=>dateOf(i)>todayIso);
  if(idx!==undefined) document.getElementById("d"+idx).open=true;
}

function render(){
  const o=order();
  let all=0,done=0;
  chips.innerHTML="";
  o.forEach(di=>{
    const day=document.getElementById("d"+di);
    root.appendChild(day);
    const iso=dateOf(di);
    day.querySelector(".dname").innerHTML=esc(short(iso))+(dates[di]&&dates[di]!==plan[di].iso?`<span class="moved">moved</span>`:"");
    const inp=day.querySelector("input[type=date]");if(inp.value!==iso) inp.value=iso;
    const boxes=day.querySelectorAll("input[type=checkbox]");let n=0;
    boxes.forEach(b=>{b.checked=!!state[b.dataset.k];b.closest("li").classList.toggle("checked",b.checked);if(b.checked)n++});
    day.querySelector(".count").textContent=`${n}/${boxes.length}`;
    const full=n===boxes.length;day.classList.toggle("done",full);
    const c=document.createElement("button");c.type="button";c.dataset.i=di;
    c.className="chip"+(full?" done":"")+(iso===todayIso?" today":"");
    c.textContent=`${short(iso).replace(/,.*$/,"")} · ${n}/${boxes.length}`;
    chips.appendChild(c);
    all+=boxes.length;done+=n;
  });
  document.getElementById("totalTxt").textContent=`${done} / ${all}`;
  document.getElementById("totalBar").style.width=(all?done/all*100:0)+"%";
  const first=dateOf(o[0]), last=dateOf(o[o.length-1]);
  const spare=Math.round((parse(DUE)-parse(last))/864e5);
  const o2={weekday:"long",month:"long",day:"numeric"};
  document.getElementById("lead").textContent=
    `From ${fmt(first,o2)} to ${fmt(last,o2)}. `+
    (spare>0?`That leaves ${spare} day${spare===1?"":"s"} of buffer before the October 28 deadline. `:spare===0?`That ends right on the October 28 deadline. `:`Careful: that runs past the October 28 deadline. `)+
    `Open any day and change its date to move it. Each tag shows which report section the task feeds.`;
}

root.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.k){state[t.dataset.k]=t.checked;store(KEY,state);render()}
  else if(t.dataset.d!==undefined && t.value){dates[t.dataset.d]=t.value;store(DKEY,dates);render();t.focus({preventScroll:true})}
});
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const d=document.getElementById("d"+b.dataset.i);d.open=true;d.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});
document.getElementById("reset").addEventListener("click",()=>{state={};store(KEY,state);render()});
document.getElementById("resetDates").addEventListener("click",()=>{dates={};store(DKEY,dates);render()});

const logo=document.getElementById("logo"), hopG=document.getElementById("hopper"), shadow=document.getElementById("shadow");
const L=15, H0=12, H1=5.5, G=66, PT=7, CX=[22,50];
function drawHopper(hh,lift){
  const w=Math.sqrt(L*L-hh*hh), yb=G-PT-lift, ym=yb-hh, yt=yb-2*hh;
  let links="",pins="";
  CX.forEach(cx=>{
    links+=`M${cx} ${yb}L${cx-w} ${ym}L${cx} ${yt}L${cx+w} ${ym}Z`;
    [[cx,yb],[cx-w,ym],[cx,yt],[cx+w,ym]].forEach(([x,y])=>pins+=`<circle cx="${x}" cy="${y}" r="2.3"/>`);
  });
  hopG.innerHTML=
    `<path d="${links}" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/>`+
    `<rect x="5" y="${yt-PT}" width="62" height="${PT}" rx="3.5" fill="currentColor"/>`+
    `<rect x="5" y="${yb}" width="62" height="${PT}" rx="3.5" fill="currentColor"/>`+
    `<g fill="var(--bg)" stroke="currentColor" stroke-width="1.4">${pins}</g>`;
  const k=Math.max(.4,1-lift/40);
  shadow.setAttribute("rx",30*k);shadow.setAttribute("opacity",(.22*k).toFixed(3));
}
const lerp=(a,b,u)=>a+(b-a)*u, clamp=u=>Math.max(0,Math.min(1,u));
const inOut=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, outQ=u=>1-(1-u)*(1-u);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function pose(t){
  let hh=H0;
  if(t<.10) hh=H0;
  else if(t<.30) hh=lerp(H0,H1,inOut(seg(t,.10,.30)));   // squash the linkages
  else if(t<.38) hh=H1;                                    // hold, band stretched
  else if(t<.46) hh=lerp(H1,H0+1.5,outQ(seg(t,.38,.46))); // release
  else if(t<.56) hh=lerp(H0+1.5,H0,seg(t,.46,.56));
  else if(t<.80) hh=H0;
  else if(t<.86) hh=lerp(H0,H0-3.5,outQ(seg(t,.80,.86))); // landing
  else hh=lerp(H0-3.5,H0,inOut(seg(t,.86,.96)));
  const u=seg(t,.44,.80), lift=(t>.44&&t<.80)?4*24*u*(1-u):0;
  return [hh,lift];
}
const still=matchMedia("(prefers-reduced-motion: reduce)");
let raf=0;
function jump(){
  cancelAnimationFrame(raf);
  if(still.matches){drawHopper(H0,0);return}
  const DUR=1800, t0=performance.now()+300;
  const step=now=>{const t=clamp((now-t0)/DUR);const[hh,lift]=pose(t);drawHopper(hh,lift);if(t<1)raf=requestAnimationFrame(step)};
  drawHopper(H0,0);raf=requestAnimationFrame(step);
}
logo.addEventListener("click",jump);
jump();
render();
openToday();
</script>
